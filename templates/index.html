<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Trend Pulse Explorer</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(to right, #1f1c2c, #928dab);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
        }

        .container {
            max-width: 600px;
            margin: 5% auto;
            background-color: rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.2rem;
        }

        label {
            display: block;
            margin: 15px 0 5px;
            font-weight: bold;
            color: #f0f0f0;
        }

        input[type="text"], select {
            width: 100%;
            padding: 12px 15px;
            border-radius: 5px;
            border: none;
            font-size: 1rem;
            margin-bottom: 10px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 5px;
            background-color: #4caf50;
            color: white;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s ease;
            margin-top: 20px;
        }

        button:hover {
            background-color: #45a049;
        }

        h2 {
            text-align: center;
            margin-top: 30px;
        }

        img {
            display: block;
            margin: 20px auto;
            border-radius: 8px;
            max-width: 100%;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Trend Pulse Explorer</h1>

        <form method="POST">
            <label for="product">Product Keyword:</label>
            <input type="text" id="product" name="product" required>

            <label for="year">Year:</label>
            <input type="text" id="year" name="year" required>

            <label for="option">Choose Analysis Option:</label>
            <select id="option" name="option" required>
                <option value="1">Overall Sentiment Distribution</option>
                <option value="2">Monthly Sentiment Trend</option>
                <option value="3">Monthly Peak Product Mentions</option>
                <option value="4">Best Performing Period</option>
                <option value="5">Worst Performing Period</option>
            </select>

            <button type="submit">Analyze</button>
        </form>

        {% if result %}
            <h2>{{ result }}</h2>
            {% if image %}
                <img src="{{ image }}" alt="Sentiment Analysis Graph">
            {% endif %}
        {% endif %}
    </div>
</body>
</html>
